services:

  postgres:
    image: postgres:17
    container_name: olhovivo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olhovivo}
      POSTGRES_USER: ${POSTGRES_USER:-olhovivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olhovivo123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olhovivo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: olhovivo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: olhovivo_backend
    restart: unless-stopped
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./vision/output:/app/static/output
      - ./vision/output/snapshots:/app/static/snapshots
      - ./vision/output/videos:/app/static/videos
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  vision:
    build: ./vision
    container_name: olhovivo_vision
    restart: unless-stopped
    working_dir: /app
    command: python -m src.main
    volumes:
      - ./vision:/app
      - ./vision/output:/app/output
    environment:
      - VIDEO_SOURCE=${VIDEO_SOURCE:-rtsp://admin:admin@192.168.1.3:554/cam/realmonitor?channel=1&subtype=1}
      - VISION_OUTPUT_DIR=/app/output
      - BACKEND_URL=http://backend:8000
      - FILIAL_ID=${FILIAL_ID:-RIUAL_028}
      - CAMERA_ID=${CAMERA_ID:-CAM01}
    env_file:
      - .env
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: olhovivo_frontend
    restart: unless-stopped
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data:
